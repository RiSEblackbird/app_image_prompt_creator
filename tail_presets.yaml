tails:
  image:
    - id: none
      description_ja: "（なし）"
      prompt: ""
    - id: photo_8k
      description_ja: "超高解像度写真 (8K)"
      prompt: "A high resolution photograph. Very high resolution. 8K photo"
    - id: sumi_e
      description_ja: "日本画・墨絵スタイル"
      prompt: "a Japanese ink painting. Zen painting"
    - id: medieval_painting
      description_ja: "中世ヨーロッパ絵画スタイル"
      prompt: "a Medieval European painting."

  movie:
    - id: none
      description_ja: "（末尾の動画スタイル指定を付けない）"
      prompt: ""
    # ---- シネマティック基礎スタイル（撮影・演出・編集テンプレ）----
    - id: section_movie_core
      description_ja: "===【カテゴリ】シネマティック基礎スタイル（撮影・演出・編集テンプレ）"
      prompt: ""
    # ベース撮影フォーマット／質感プリセット
    - id: section_sub_movie_format
      description_ja: "==【サブ】ベース撮影フォーマット／質感プリセット"
      prompt: ""
    - id: movie_70mm
      description_ja: "70mmフィルムで撮影された、ドラマチック照明の横移動シネマティック全編"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is sweeping cinematic footage that is shot on 70mm film with dramatic sideways camera motion, delivering intensely polished visual storytelling\",\"look\":\"dramatic lighting\"}}"
    - id: movie_ultra_fidelity
      description_ja: "4K HDR で収録された、高精細なダイナミックトラッキングショット全編"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is dynamic tracking footage captured in ultra high fidelity 4K HDR, delivering intensely polished visual storytelling\",\"format\":\"4K HDR\"}}"
    - id: movie_8k_master
      description_ja: "8Kマスターで滑らかな編集リズムを持つ高解像度シネマティック作品"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is an 8K-mastered cinematic video with smooth editing rhythm across the entire piece, delivering intensely polished visual storytelling\",\"format\":\"8K\"}}"
    - id: movie_architecture_dynamic_8k
      description_ja: "8Kシネマティックベース（制約は手動指定）"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is an 8K-mastered cinematic video with smooth editing rhythm across the entire piece, delivering intensely polished visual storytelling\",\"format\":\"8K\"}}"
    - id: movie_60s_film
      description_ja: "1960年代のフィルムプリント風グレーディングで仕上げた雰囲気重視のカット群"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is atmospheric footage graded to look like an authentic 1960s film print, delivering intensely polished visual storytelling\",\"grade\":\"film emulation\"}}"
    - id: movie_studio_lighting
      description_ja: "高コントラストなスタジオライティングとクリーンな構図のショット全編"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a crisp studio-lit video with high contrast and clean composition throughout, delivering intensely polished visual storytelling\",\"look\":\"studio lighting\"}}"
    - id: movie_16mm_grain
      description_ja: "16mmフィルムの荒い粒子感とオーガニックな質感を持つ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with authentic 16mm film grain and organic texture throughout, delivering intensely polished visual storytelling\",\"format\":\"16mm film\",\"look\":\"visible grain\"}}"
    - id: movie_anamorphic_flare
      description_ja: "アナモルフィックレンズ特有の横長フレアとボケ味を持つ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage shot with anamorphic lenses featuring characteristic horizontal flares and oval bokeh, delivering intensely polished visual storytelling\",\"format\":\"anamorphic\",\"look\":\"lens flares\"}}"
    - id: movie_log_flat
      description_ja: "LOGガンマでフラットに収録された、グレーディング前提の広ダイナミックレンジ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is flat LOG-gamma footage preserving maximum dynamic range for color grading flexibility, delivering intensely polished visual storytelling\",\"format\":\"LOG gamma\",\"grade\":\"flat profile\"}}"
    - id: movie_high_contrast
      description_ja: "深い黒と明るい白を強調したハイコントラストな映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is high-contrast footage with crushed blacks and bright highlights creating bold visual separation, delivering intensely polished visual storytelling\",\"look\":\"high contrast\",\"grade\":\"punchy blacks\"}}"
    - id: movie_soft_diffusion
      description_ja: "ソフトディフュージョンフィルターで柔らかく拡散した光の映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is soft diffused footage where light blooms gently and edges feel dreamlike, delivering intensely polished visual storytelling\",\"look\":\"soft diffusion\",\"filter\":\"pro-mist effect\"}}"
    - id: movie_monochrome
      description_ja: "モノクロームで撮影された、光と影のコントラストを強調した映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is monochrome footage emphasizing the interplay of light and shadow without color distraction, delivering intensely polished visual storytelling\",\"grade\":\"black and white\",\"look\":\"tonal contrast\"}}"
    - id: movie_desaturated_cold
      description_ja: "彩度を落とした冷たいトーンの映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is desaturated footage with a cold color temperature and muted tones, delivering intensely polished visual storytelling\",\"grade\":\"low saturation\",\"look\":\"cold palette\"}}"
    - id: movie_golden_hour
      description_ja: "ゴールデンアワーの暖かく柔らかい自然光で撮影された映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage bathed in warm golden-hour sunlight with soft shadows and amber tones, delivering intensely polished visual storytelling\",\"lighting\":\"golden hour\",\"look\":\"warm natural light\"}}"
    - id: movie_overexposed_wash
      description_ja: "意図的に白飛びさせた、ウォッシュアウトした露出の映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is intentionally overexposed footage with washed-out highlights and ethereal brightness, delivering intensely polished visual storytelling\",\"exposure\":\"overexposed\",\"look\":\"blown highlights\"}}"
    - id: movie_underexposed_shadow
      description_ja: "暗めの露出で影を強調した、ローキーな映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is underexposed low-key footage where shadows dominate and details emerge from darkness, delivering intensely polished visual storytelling\",\"exposure\":\"underexposed\",\"look\":\"shadow emphasis\"}}"
    - id: movie_hdr_documentary_finish
      description_ja: "HDRドキュメンタリー調の自然なハイライト保持と実在感を持つ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is HDR-finished footage that preserves natural highlight roll-off and documentary-grade realism throughout, delivering intensely polished visual storytelling\",\"format\":\"HDR\",\"look\":\"natural highlight retention\"}}"
    - id: movie_bleach_bypass
      description_ja: "銀残し風の硬いコントラストと抑えた色で仕上げた映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage graded with a bleach-bypass-inspired look, combining hard contrast with restrained color for severe visual texture, delivering intensely polished visual storytelling\",\"grade\":\"bleach bypass\",\"look\":\"hard contrast\"}}"
    - id: movie_silver_blue_night
      description_ja: "銀色がかった青夜景トーンで静かな冷気を帯びた映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is silver-blue night footage with cool metallic tonality and restrained nocturnal atmosphere, delivering intensely polished visual storytelling\",\"grade\":\"silver blue night\",\"look\":\"cool nocturne\"}}"
    - id: movie_vintage_telecine
      description_ja: "テレシネ転送後のような退色と微細な色ズレを持つ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is vintage telecine-style footage with soft fading, minor color drift, and archival transfer character, delivering intensely polished visual storytelling\",\"grade\":\"telecine emulation\",\"look\":\"archival softness\"}}"
    - id: movie_day_for_night
      description_ja: "昼景を夜景に見立てるデイ・フォー・ナイト処理の映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is day-for-night processed footage that transforms daylight scenes into stylized nocturnal imagery, delivering intensely polished visual storytelling\",\"grade\":\"day for night\",\"look\":\"stylized moonlit illusion\"}}"
    - id: movie_candlelit_warmth
      description_ja: "ろうそく光のような暖色の揺らぎで包む親密な映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is candlelit footage wrapped in warm flickering illumination and intimate shadow falloff, delivering intensely polished visual storytelling\",\"lighting\":\"candlelit warmth\",\"look\":\"flickering amber glow\"}}"
    - id: movie_rain_slick_gloss
      description_ja: "濡れた面の反射と艶感を強調したレインスリックな映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is rain-slick footage emphasizing glossy wet surfaces, reflected highlights, and saturated atmosphere, delivering intensely polished visual storytelling\",\"look\":\"wet gloss reflections\",\"weather\":\"rain-soaked\"}}"
    - id: movie_backlit_haze
      description_ja: "逆光の霞と浮遊粒子で奥行きを感じさせる映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is backlit hazy footage where atmospheric particles catch light and create layered depth, delivering intensely polished visual storytelling\",\"lighting\":\"strong backlight\",\"look\":\"volumetric haze\"}}"
    - id: movie_clean_digital_precision
      description_ja: "ノイズを抑えたクリーンなデジタル精細感を前面に出した映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is clean digital footage with restrained noise, crisp edges, and precision-rendered detail throughout, delivering intensely polished visual storytelling\",\"format\":\"clean digital\",\"look\":\"precision clarity\"}}"
    - id: movie_muted_earth_palette
      description_ja: "土や石を思わせる低彩度アースカラーで統一した映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage unified by muted earth tones, subdued saturation, and grounded natural material color, delivering intensely polished visual storytelling\",\"grade\":\"muted earth palette\",\"look\":\"natural subdued color\"}}"

    # カメラワーク／ショット運動プリセット
    - id: section_sub_movie_camera
      description_ja: "==【サブ】カメラワーク／ショット運動プリセット"
      prompt: ""
    - id: movie_tight_cinematic
      description_ja: "4K解像度で、制御された滑らかなカメラワークのタイトなシネマティックショット"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a tight cinematic video in 4K with controlled, fluid camera motion from start to finish, delivering intensely polished visual storytelling\",\"format\":\"4K\"}}"
    - id: movie_handheld
      description_ja: "微かなモーションブラーと自然な粒子感を伴うハンドヘルド撮影映画"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a handheld cinematic video with subtle motion blur and natural grain across the entire recording, delivering intensely polished visual storytelling\",\"camera\":\"handheld\"}}"
    - id: movie_drone_one_shot
      description_ja: "ドローンでシーン全体をワンテイクで滑らかに飛行しながら見せる空撮映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is continuous one-take aerial drone footage that flies smoothly through the whole scene, delivering intensely polished visual storytelling\",\"camera\":\"drone one-shot\"}}"
    - id: movie_dynamic_samurai
      description_ja: "天候の変化と幾何学的構図を強調した、壮大な時代劇シネマティック"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is an epic historical cinematic video that focuses on dynamic weather movement and strong geometric composition, delivering intensely polished visual storytelling\",\"style\":\"epic historical atmosphere\"}}"
    - id: movie_steadicam_flow
      description_ja: "ステディカムで被写体に滑らかに追従する流れるような映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is steadicam footage that glides smoothly alongside subjects with fluid, floating movement, delivering intensely polished visual storytelling\",\"camera\":\"steadicam\",\"movement\":\"flowing follow\"}}"
    - id: movie_dolly_zoom
      description_ja: "ドリーズームで空間が歪む不安定な視覚効果を持つ映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage using dolly zoom to create unsettling spatial distortion where the background shifts while the subject stays fixed, delivering intensely polished visual storytelling\",\"camera\":\"dolly zoom\",\"effect\":\"vertigo effect\"}}"
    - id: movie_crane_sweep
      description_ja: "クレーンで大きく弧を描くスイープショットの映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is crane footage with sweeping arc movements that reveal scale and spatial relationships, delivering intensely polished visual storytelling\",\"camera\":\"crane\",\"movement\":\"sweeping arc\"}}"
    - id: movie_static_tableau
      description_ja: "完全に静止した絵画的構図で世界を見つめる映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is static tableau footage with locked-off camera holding painterly compositions while the world moves within frame, delivering intensely polished visual storytelling\",\"camera\":\"static\",\"composition\":\"tableau vivant\"}}"
    - id: movie_whip_pan
      description_ja: "ホイップパンで瞬時に視点を切り替える高速カメラワーク"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with rapid whip pans that snap between subjects creating energetic visual transitions, delivering intensely polished visual storytelling\",\"camera\":\"whip pan\",\"movement\":\"snap transitions\"}}"
    - id: movie_push_in
      description_ja: "被写体にゆっくりと寄っていく緊張感のあるプッシュイン"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with slow deliberate push-ins that build tension by gradually closing distance to the subject, delivering intensely polished visual storytelling\",\"camera\":\"push in\",\"movement\":\"gradual approach\"}}"
    - id: movie_pull_back
      description_ja: "被写体からゆっくり引いてスケールを明かすプルバック"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with slow pull-back movements that reveal context and scale by gradually retreating from the subject, delivering intensely polished visual storytelling\",\"camera\":\"pull back\",\"movement\":\"gradual reveal\"}}"
    - id: movie_circular_orbit
      description_ja: "被写体の周囲を円を描くように周回するオービットショット"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with circular orbit movements that rotate around subjects maintaining consistent distance and focus, delivering intensely polished visual storytelling\",\"camera\":\"orbit\",\"movement\":\"360 rotation\"}}"
    - id: movie_dutch_angle
      description_ja: "傾いたダッチアングルで不安定さを表現する映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage shot at tilted dutch angles creating visual unease and dynamic tension through skewed horizon lines, delivering intensely polished visual storytelling\",\"camera\":\"dutch angle\",\"composition\":\"tilted frame\"}}"
    - id: movie_low_angle_power
      description_ja: "ローアングルから見上げて存在感を強調する映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is low-angle footage looking up at subjects to convey power, scale, or imposing presence, delivering intensely polished visual storytelling\",\"camera\":\"low angle\",\"perspective\":\"looking up\"}}"
    - id: movie_top_down_descent
      description_ja: "真上からゆっくり降下して構造を明らかにするトップダウン移動"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is top-down descending footage that slowly drops from overhead to reveal structure and spatial order, delivering intensely polished visual storytelling\",\"camera\":\"top-down descent\",\"movement\":\"vertical reveal\"}}"
    - id: movie_lateral_tracking_run
      description_ja: "横方向へ等速で追い続けるサイドトラッキング映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is lateral tracking footage that maintains side-on alignment while moving at matched speed with the subject, delivering intensely polished visual storytelling\",\"camera\":\"side tracking\",\"movement\":\"lateral pursuit\"}}"
    - id: movie_over_shoulder_drift
      description_ja: "肩越しの距離感を保ちながら漂うように追う映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is over-the-shoulder drift footage that stays close behind the subject with gentle floating motion, delivering intensely polished visual storytelling\",\"camera\":\"over shoulder\",\"movement\":\"soft trailing drift\"}}"
    - id: movie_snap_zoom
      description_ja: "瞬間的なズームで注意を一点に集中させる映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage using snap zooms that rapidly tighten framing to punctuate sudden emphasis and urgency, delivering intensely polished visual storytelling\",\"camera\":\"snap zoom\",\"movement\":\"instant focal punch\"}}"
    - id: movie_reverse_tracking_lead
      description_ja: "被写体の前を後退しながら導くように進むリバーストラック映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is reverse tracking footage that retreats in front of the subject while guiding forward momentum, delivering intensely polished visual storytelling\",\"camera\":\"reverse track\",\"movement\":\"leading retreat\"}}"
    - id: movie_macro_slider
      description_ja: "微細な対象を横切るスライダー移動で情報を拾う映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is macro slider footage that glides across fine details with controlled linear motion, delivering intensely polished visual storytelling\",\"camera\":\"macro slider\",\"movement\":\"detail sweep\"}}"
    - id: movie_pendulum_swing
      description_ja: "振り子のような往復弧を描いて揺らぐ視点の映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is pendulum swing footage that arcs back and forth in repeated suspended motion, delivering intensely polished visual storytelling\",\"camera\":\"pendulum arc\",\"movement\":\"oscillating swing\"}}"
    - id: movie_fpv_dive
      description_ja: "高度差を一気に切り裂くFPV的な急降下ショット"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is FPV-style dive footage that plunges rapidly through vertical space with aggressive speed and precision, delivering intensely polished visual storytelling\",\"camera\":\"fpv dive\",\"movement\":\"rapid descent\"}}"
    - id: movie_locked_horizon_glide
      description_ja: "水平線を安定して保ちながら滑走するグライド映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is locked-horizon glide footage that preserves a steady horizon while moving smoothly across space, delivering intensely polished visual storytelling\",\"camera\":\"stabilized glide\",\"movement\":\"level horizon travel\"}}"
    - id: movie_crowd_weave
      description_ja: "人混みの隙間を縫って前進する密着型のカメラワーク"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is crowd-weaving footage that threads through dense movement with close reactive camera navigation, delivering intensely polished visual storytelling\",\"camera\":\"crowd weave\",\"movement\":\"close-quarter navigation\"}}"

    # 編集リズム／シーケンス構成プリセット
    - id: section_sub_movie_edit
      description_ja: "==【サブ】編集リズム／シーケンス構成プリセット"
      prompt: ""
    - id: movie_trailer
      description_ja: "モダンな映画予告編のように、タイトにカットを繋いだ高速モンタージュ全編"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a fast-paced modern movie trailer with tightly cut shots throughout, delivering intensely polished visual storytelling\",\"grade\":\"Dolby Vision\"}}"
    - id: movie_scifi_trailer
      description_ja: "ドルビーサウンドを想起させる、モダンなSF映画トレーラー調の高速カット"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a modern sci-fi movie trailer with cinematic lighting and bold pacing, delivering intensely polished visual storytelling\",\"grade\":\"Dolby Digital atmosphere\"}}"
    - id: movie_accelerating_edit
      description_ja: "時間が進むほどカットスイッチが加速していくドラマティックな編集構成"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a dramatic edit where cut switches accelerate more and more over time, delivering intensely polished visual storytelling\",\"style\":\"dynamic speed acceleration\"}}"
    - id: movie_nature_to_future
      description_ja: "自然描写から未来技術のシーンへと連続的に移行するドキュメンタリー構成"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a documentary video that begins with natural landscapes and then continuously transitions into scenes of futuristic technology, delivering intensely polished visual storytelling\",\"style\":\"gradual transition spanning vast time\"}}"
    - id: movie_one_shot_doc
      description_ja: "世界をリアルに追い続ける、ワンショット構成のドキュメンタリー映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is a single-take documentary video that follows this world in a realistic tone from beginning to end, delivering intensely polished visual storytelling\",\"style\":\"one-shot documentary\"}}"
    - id: movie_long_take
      description_ja: "カットを入れずに長回しで持続する没入感のある映像"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is long-take footage that sustains shots without cutting, immersing viewers in unbroken time and space, delivering intensely polished visual storytelling\",\"editing\":\"extended takes\",\"structure\":\"minimal cuts\"}}"
    - id: movie_jump_cut
      description_ja: "ジャンプカットで時間を不連続に飛ばす実験的な編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage edited with deliberate jump cuts that skip time discontinuously, creating jarring but expressive rhythm, delivering intensely polished visual storytelling\",\"editing\":\"jump cuts\",\"style\":\"temporal disruption\"}}"
    - id: movie_cross_cut
      description_ja: "2つ以上の出来事をクロスカットで並行に見せる編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is cross-cut footage that interweaves two or more parallel events, building tension through alternation, delivering intensely polished visual storytelling\",\"editing\":\"cross-cutting\",\"structure\":\"parallel narratives\"}}"
    - id: movie_match_cut
      description_ja: "形や動きで視覚的につなぐマッチカット編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage connected through match cuts where shapes, movements, or compositions bridge disparate scenes, delivering intensely polished visual storytelling\",\"editing\":\"match cuts\",\"transition\":\"visual rhyming\"}}"
    - id: movie_rhythmic_montage
      description_ja: "音楽や内部リズムに同期したモンタージュ編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is rhythmic montage footage where cuts synchronize with music or internal rhythm to create pulse-driven sequences, delivering intensely polished visual storytelling\",\"editing\":\"rhythmic montage\",\"sync\":\"beat-matched\"}}"
    - id: movie_slow_dissolve
      description_ja: "ゆっくりとしたディゾルブで夢のように場面を溶かす編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with slow dissolve transitions that blend scenes dreamlike, allowing images to overlap and merge gradually, delivering intensely polished visual storytelling\",\"transition\":\"slow dissolves\",\"style\":\"ethereal blending\"}}"
    - id: movie_smash_cut
      description_ja: "スマッシュカットで急激にシーンを切り替える衝撃的な編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with smash cuts that abruptly slam from one scene to another, creating shock and disorientation, delivering intensely polished visual storytelling\",\"editing\":\"smash cuts\",\"style\":\"jarring impact\"}}"
    - id: movie_fade_transition
      description_ja: "フェードイン・アウトで緩やかに場面を移行する編集"
      prompt: "{\"video_style\":{\"scope\":\"full_movie\",\"description\":\"this is footage with fade transitions that gently ease in and out of scenes, marking passages of time or chapter breaks, delivering intensely polished visual storytelling\",\"transition\":\"fades\",\"style\":\"gentle passage\"}}"
    - id: movie_staccato_edit
      description_ja: "スタッカートのように短い断片を積み重ねる編集"
